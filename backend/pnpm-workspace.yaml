# Configuración de pnpm para endurecer la cadena de suministro.
# - Solo se instalan versiones publicadas hace más de 7 días (10080 minutos).
# - Versiones exactas, sin rangos ^ ni ~.
# - Los scripts de instalación (postinstall, etc.) quedan bloqueados: ninguna
#   de nuestras dependencias los necesita.
minimumReleaseAge: 10080
saveExact: true
strictDepBuilds: true
